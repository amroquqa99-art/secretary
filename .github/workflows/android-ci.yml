name: Import LifeOS baseline

on:
  push:
    branches:
      - migration/lifeos-baseline

permissions:
  contents: write

concurrency:
  group: lifeos-baseline-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout secretary history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: migration/lifeos-baseline

      - name: Fetch pinned LifeOS baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/lifeos
          git init -q /tmp/lifeos
          git -C /tmp/lifeos remote add origin https://github.com/nbramia/LifeOS.git
          git -C /tmp/lifeos fetch -q --depth 1 origin bae2bfba66c542e17c4aa08aaebae6509b4a3e69
          git -C /tmp/lifeos checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/lifeos rev-parse HEAD)" = "bae2bfba66c542e17c4aa08aaebae6509b4a3e69"

      - name: Replace working tree except temporary migration workflow
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf -- {} +
          rsync -a --delete --exclude='.git' --exclude='.github' /tmp/lifeos/ ./

          git add -A
          while IFS= read -r -d '' path; do
            case "$path" in
              .github/workflows/*) continue ;;
            esac
            git add -f -- "$path"
          done < <(git -C /tmp/lifeos ls-files -z)

      - name: Verify imported bytes before commit
        shell: bash
        run: |
          set -euo pipefail
          drift="$(rsync -ainc --delete --exclude='.git' --exclude='.github' /tmp/lifeos/ ./)"
          if [ -n "$drift" ]; then
            printf '%s\n' "$drift"
            echo "LifeOS import verification failed." >&2
            exit 1
          fi
          test -n "$(git diff --cached --name-only)"
          echo "Pinned upstream SHA: $(git -C /tmp/lifeos rev-parse HEAD)"
          echo "Pinned upstream tree: $(git -C /tmp/lifeos rev-parse HEAD^{tree})"
          echo "Imported tracked files (excluding temporary workflow): $(git -C /tmp/lifeos ls-files | grep -vc '^.github/workflows/')"

      - name: Commit baseline on migration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "LifeOS Baseline Import"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "chore: replace working tree with LifeOS upstream bae2bfba" \
            -m "Preserves the complete secretary history as the parent chain. Upstream source: nbramia/LifeOS@bae2bfba66c542e17c4aa08aaebae6509b4a3e69. The temporary migration workflow is intentionally preserved for this commit and is removed after external verification."
          git push origin HEAD:migration/lifeos-baseline
