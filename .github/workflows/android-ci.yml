name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install current Android CLI and toolchain
        shell: bash
        run: |
          CLI_ZIP="$RUNNER_TEMP/android-command-line-tools.zip"
          curl --fail --location --retry 3 \
            "https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip" \
            --output "$CLI_ZIP"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $CLI_ZIP" | sha256sum --check -
          rm -rf "$RUNNER_TEMP/android-cli"
          mkdir -p "$RUNNER_TEMP/android-cli"
          unzip -q "$CLI_ZIP" -d "$RUNNER_TEMP/android-cli"
          SDKMANAGER="$RUNNER_TEMP/android-cli/cmdline-tools/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --channel=3 \
            "platforms;android-37" \
            "build-tools;36.0.0" \
            "ndk;30.0.16248370" \
            "cmake;3.22.1"

      - name: Verify database migrations and server
        shell: bash
        run: |
          python3 checks/verify_migration.py
          python3 checks/verify_v4.py
          python3 checks/verify_v5.py
          python3 -m unittest discover -s server -p 'test_*.py' -v

      - name: Unit tests, APK and lint
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
